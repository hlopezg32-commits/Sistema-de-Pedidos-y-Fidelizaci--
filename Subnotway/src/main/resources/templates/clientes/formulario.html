<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modoEdicion} ? 'Editar Cliente - Subnotway' : 'Nuevo Cliente - Subnotway'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-shop me-2"></i>Subnotway
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ventas}">Ventas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos}">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/fidelizacion}">Fidelización</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/reportes}">Reportes PDF</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/movil}">
                        <i class="bi bi-phone me-1"></i>Celular
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="card-title mb-0 fw-bold">
                        <i th:class="${modoEdicion} ? 'bi bi-pencil-square me-2' : 'bi bi-person-plus me-2'"></i>
                        <span th:text="${modoEdicion} ? 'Editar Cliente' : 'Registrar Nuevo Cliente'"></span>
                    </h5>
                </div>
                <div class="card-body p-4">
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
                    </div>

                    <form th:action="${modoEdicion} ? @{/clientes/actualizar} : @{/clientes/guardar}" method="post">
                        <input th:if="${modoEdicion}" type="hidden" name="idCliente" th:value="${cliente.idCliente}">

                        <div class="mb-3">
                            <label for="identificador" class="form-label fw-semibold">Identificador (NIT o DPI) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="identificador" name="identificador" th:value="${cliente.identificador}" required autofocus placeholder="Ej. 12345678-9 o 55551234">
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre Completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" th:value="${cliente.nombre}" required placeholder="Ej. Carlos Mendoza">
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" th:value="${cliente.telefono}" placeholder="Ej. 5555-1234">
                        </div>

                        <div class="mb-4">
                            <label for="correo" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="correo" name="correo" th:value="${cliente.correo}" placeholder="cliente@correo.com">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-save me-1"></i>Guardar Cliente
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center text-muted py-4 mt-5">
    <small>Subnotway &copy; 2026 - Registro de Clientes</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
